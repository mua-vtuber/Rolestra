name: CI

# Fast pre-merge gate: typecheck + lint + unit/integration vitest on a
# single Linux runner. Restores automated quality gates that lapsed when
# the previous playwright.yml workflow was removed (commit 5183338).
#
# Scope is intentionally narrow:
#   - The full gate (typecheck + lint + whole vitest suite + inspector)
#     runs on Linux only (ubuntu-latest). The cross-OS packaging matrix
#     lives in release.yml and runs on tag push.
#   - WP11c 항목 7 — 여기에 windows-latest job 하나를 더 둔다. Windows
#     에서만 도는 시험 (CLI spawn 의 `.cmd` 처리 F01, junction 경로) 이
#     ubuntu 에서는 통째로 skip 되어, 그 코드가 깨져도 CI 가 초록으로
#     남았다. Windows job 은 그 세 묶음만 돌린다 — 전체 suite 를 두 OS
#     에서 돌리는 것은 얻는 것에 비해 시간이 너무 든다.
#   - No Playwright Electron E2E. Headed Electron on hosted runners is
#     flake-prone and slow; e2e re-introduction is deferred.
#   - vitest (`npm test`) covers unit + integration suites. The
#     `pretest` hook rebuilds better-sqlite3 against the host Node ABI
#     automatically, so no explicit rebuild step is required.
#
# Node version is pinned to match release.yml to prevent drift between
# the CI gate and the packaging pipeline. It must satisfy dependency
# engine constraints such as eslint-visitor-keys' Node >=22.13.0 floor.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (vitest unit + integration)
        run: npm test

      # R12-C2 T41 — 검사관 안전 7 카테고리. continue-on-error 라 CI 를
      # 막지 않고 결과만 보인다. 막기 시작하는 시점은 사용자 승인 게이트로
      # 정해져 있어 (계획서 P7 T41) 코드가 대신 켜지 않는다. 켜는 방법은
      # tools/inspectors/config.ts 의 failClosed 를 true 로 바꾸고 여기의
      # continue-on-error 를 지우는 것 — 두 곳 모두 사람이 결정한다.
      - name: Inspector (안전 7 카테고리, phase 2)
        continue-on-error: true
        run: npm run inspect -- --phase=2

  # WP11c 항목 7 — Windows 전용 시험.
  #
  # src/main/providers/cli 의 실제 spawn 시험은 `process.platform !==
  # 'win32'` 이면 건너뛴다. CI 가 ubuntu 하나뿐이라 그 시험들은 한 번도
  # 돌지 않았고, `.cmd` 래퍼 처리 (F01) 나 junction 경로가 깨져도 CI 는
  # 초록이었다. 여기서 그 세 묶음만 Windows 에서 돌린다.
  #
  # typecheck / lint / inspector 는 OS 를 타지 않으므로 ubuntu job 에만
  # 둔다 — 두 번 돌릴 이유가 없다.
  verify-windows:
    name: Windows 전용 시험 (cli spawn + junction)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` 의 pretest 를 타지 않고 vitest 를 직접 부르므로
      # better-sqlite3 재빌드를 여기서 명시한다 (Node ABI).
      - name: Rebuild better-sqlite3 for Node
        run: npm run rebuild:node

      - name: Test (Windows 전용 묶음)
        run: npx vitest run src/main/providers/cli tools/cli-smoke src/main/projects
